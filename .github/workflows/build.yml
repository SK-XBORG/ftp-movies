name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          flutter create --platforms=android --project-name ftp_movies app
          cp pubspec.yaml app/pubspec.yaml
          rm -rf app/lib && cp -r lib app/lib
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' app/android/app/src/main/AndroidManifest.xml
          cd app && flutter pub get && flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/*.apk
          
